services:
  - type: web
    name: orientia-web
    runtime: node
    buildCommand: npm install --omit=dev --package-lock=false
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
